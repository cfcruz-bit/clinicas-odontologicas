app = "clinicas-odontologicas-uam"
primary_region = "iad"

[deploy]
  release_command = "flask --app prototipo crear-tablas"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
