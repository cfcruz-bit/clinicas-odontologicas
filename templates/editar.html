{% extends "base.html" %}
{% block titulo %}Editar {{ p.nombre }} - Clínicas Odontológicas{% endblock %}
{% block contenido %}
  <p><a href="{{ url_for('expediente', pid=p.id) }}">&larr; Volver al expediente</a></p>
  <h2>Corregir datos del paciente</h2>

  <form method="post">
    <fieldset>
      <legend>Datos del paciente</legend>
      <div class="campo"><span>Nombre: *</span><input name="nombre" value="{{ p.nombre }}"></div>
      <div class="campo"><span>Cédula: *</span><input name="cedula" value="{{ p.cedula }}"></div>
      <div class="campo"><span>Teléfono</span><input name="telefono" value="{{ p.telefono }}"></div>
      <div class="acciones">
        <a class="btn" href="{{ url_for('expediente', pid=p.id) }}">Cancelar</a>
        <button class="btn">Guardar</button>
      </div>
    </fieldset>
  </form>
{% endblock %}
